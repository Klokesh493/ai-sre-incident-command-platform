rule_files:
  - rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'ops_evaluations_total{decision="review"}'
        values: '0+1x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: OperationsEvaluationHolds
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Repeated operations decisions require review
